name: CI

# The gate every change to main passes, and the gate release.yml runs again on a tagged
# commit (it calls this file as a reusable workflow, so the two cannot drift):
#   lint        eslint with typescript-eslint's recommended type-checked rules.
#   typecheck   tsc --noEmit over the sources, the tests and the vitest config, then the
#               build, built twice to check the packed tarball is the same bytes.
#   test        vitest with coverage, whose thresholds in vitest.config.ts fail the job below
#               100 percent per file. It runs twice: on .nvmrc's version as `test`, the
#               check the ruleset requires, and on Node 22, the oldest line package.json's
#               engines admits, as `test (node 22)`.
# Every other job runs on the Node version in .nvmrc.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      no_cache:
        description: >-
          Install with no npm cache. release.yml sets it: a tag run could restore a cache
          written by any main-branch run, and a restored cache is build input nobody
          reviewed in that run.
        type: boolean
        default: false

# Nothing at the top level; each job asks for what it needs, and nothing here writes.
permissions: {}

# Only pull requests cancel in flight: a superseded pull request run is waste, a
# superseded main run is history.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ !inputs.no_cache && 'npm' || '' }}
          package-manager-cache: ${{ !inputs.no_cache }}
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ !inputs.no_cache && 'npm' || '' }}
          package-manager-cache: ${{ !inputs.no_cache }}
      - run: npm ci
      - run: npm run typecheck
      # The package release.yml publishes is this build; it must compile too.
      - run: npm run build
      # The build is repeatable: a second build from the same commit, with dist/ deleted first,
      # packs to a tarball with the same sha256. npm pack fixes every entry's mtime, so no
      # SOURCE_DATE_EPOCH is needed. Both sums go to the log.
      - name: repeatable build
        # bash with pipefail (GitHub's `shell: bash`), so a failed sha256sum fails the step
        # instead of leaving two empty sums that compare equal.
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"
          npm pack --pack-destination "$RUNNER_TEMP/first"
          rm -rf dist
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP/second"
          first="$(sha256sum "$RUNNER_TEMP"/first/*.tgz | cut -d' ' -f1)"
          second="$(sha256sum "$RUNNER_TEMP"/second/*.tgz | cut -d' ' -f1)"
          echo "first pack:  $first"
          echo "second pack: $second"
          if [ -z "$first" ] || [ -z "$second" ]; then
            echo "::error::could not compute the sha256 of both tarballs"
            exit 1
          fi
          if [ "$first" != "$second" ]; then
            echo "::error::npm pack is not repeatable: the two tarballs differ"
            exit 1
          fi

  test:
    # The ruleset requires a check named exactly `test`, so the .nvmrc leg keeps that name
    # and the other leg is `test (node 22)`. fail-fast is off: a Node 22 failure must not
    # cancel the required leg.
    name: ${{ matrix.node == 'nvmrc' && 'test' || format('test (node {0})', matrix.node) }}
    strategy:
      fail-fast: false
      matrix:
        node: [nvmrc, '22']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Empty on the .nvmrc leg. On the Node 22 leg it is set, and setup-node takes
          # node-version over node-version-file.
          node-version: ${{ matrix.node != 'nvmrc' && matrix.node || '' }}
          cache: ${{ !inputs.no_cache && 'npm' || '' }}
          package-manager-cache: ${{ !inputs.no_cache }}
      - run: npm ci
      # `npm test` is `vitest run --coverage --passWithNoTests`: the thresholds are enforced,
      # and an empty suite passes only while src/ has nothing to cover.
      - run: npm test
