name: gitleaks

# Secret scanning of the whole git history with gitleaks. The binary is the upstream release
# checked against a pinned SHA-256 rather than a third-party action (gitleaks-action needs a
# licence key for an organisation's repositories). A version bump changes both lines below;
# take the digest from the release's gitleaks_<version>_checksums.txt and pick a release at
# least 7 days old. Findings are printed redacted, and any finding fails the job.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * 1' # weekly, Monday, so a rule added upstream is run against old history
  workflow_dispatch:

# Nothing at the top level; the job asks for what it needs.
permissions: {}

concurrency:
  group: gitleaks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, not only the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: gitleaks git
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
