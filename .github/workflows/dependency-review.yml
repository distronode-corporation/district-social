name: Dependency review

# Fails a pull request that ADDS a dependency (npm or an action) with a known
# moderate-or-worse vulnerability, or under a licence this Apache-2.0 project cannot ship.
# The whole tree is held to an allowlist by license-check.yml.
on:
  pull_request:

# Nothing at the top level; the job asks for what it needs.
permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # read the dependency graph of both commits
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
          # GHSA-mrhx-c7xc-m3w5 (zod 3, memory exhaustion from a crafted input) has no in-range
          # fix. zod is installed only because @atproto/api and its @atproto packages depend on
          # zod ^3 (3.25.76 in the lockfile); @anthropic-ai/sdk names it only as an optional peer,
          # and nothing here imports it. It only validates bsky.social responses, which are capped
          # at 5 MiB before parsing (RESPONSE_CAP_BYTES in src/bluesky.ts). Remove this entry
          # when @atproto moves to zod 4.
          allow-ghsas: GHSA-mrhx-c7xc-m3w5
