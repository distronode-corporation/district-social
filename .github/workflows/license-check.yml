name: License check

# Every package in package-lock.json against the licence allowlist in
# .github/scripts/check-licenses.mjs. It reads the lockfile only: no install, no network,
# no install scripts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing at the top level; the job asks for what it needs.
permissions: {}

concurrency:
  group: license-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the code
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The expression parser against known answers first, then the lockfile.
      - run: node .github/scripts/check-licenses.mjs --self-test
      - run: node .github/scripts/check-licenses.mjs
