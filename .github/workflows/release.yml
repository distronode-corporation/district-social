name: Release

# A `vX.Y.Z` tag on main publishes district-social to npm, and nothing else does:
#   guard     the tagged commit is on main, and the tag equals package.json's version.
#   test      the whole CI gate (ci.yml, called as a reusable workflow) on the tagged commit.
#   pack      builds and packs the tarball, with no publish credential in the job.
#   npm       publishes that tarball with npm trusted publishing: npm exchanges this job's
#             OIDC token for a one-time publish token (npm 11.5.1 or later) and adds the
#             provenance attestation itself. No npm token is stored anywhere. `id-token:
#             write` is granted to this job alone.
#   release   attaches the tarball, SHA256SUMS and the provenance npm recorded for it to the
#             GitHub release for the tag (creating the release from CHANGELOG.md when there
#             is none). `contents: write` is granted to this job alone, and it holds no
#             publish credential.
#
# `npm` runs only while the repository variable NPM_PUBLISH is 'true', and only after the
# package's trusted publisher on npmjs.com names this repository and this file, release.yml.
# Renaming the file or adding an environment breaks trusted publishing until npm is updated.
on:
  push:
    tags: ['v*.*.*']

# Nothing at the top level; each job asks for what it needs.
permissions: {}

# Never cancel a release in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed by the ancestry check below: a shallow clone has no merge base.
          fetch-depth: 0
          # The repository is public, so the fetch below needs no credential.
          persist-credentials: false

      # CI runs on pushes to main and on pull requests, not on tags, so a tag on a commit
      # that never reached main would be released without CI having run on it.
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/main."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: The version agrees with the tag
        id: version
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p 'require("./package.json").version')"
          lock="$(node -p 'require("./package-lock.json").version')"
          if [ "$have" != "$want" ] || [ "$lock" != "$want" ]; then
            echo "::error::the tag is $want, package.json is $have and package-lock.json is $lock."
            exit 1
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"

  # The whole CI gate, not a copy of it.
  test:
    needs: guard
    permissions:
      contents: read # check out the code
    # `./` is the documented form for a workflow in the same repository, at the same commit.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      no_cache: true

  pack:
    needs: [guard, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches anywhere in this workflow. A tag run can restore caches written by any
      # main-branch run, and a restored node_modules is build input nobody reviewed in
      # this run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: npm ci
      - run: npm run build

      - name: Pack the tarball
        run: |
          set -euo pipefail
          mkdir -p staging
          npm pack --pack-destination staging
          (cd staging && sha256sum ./*.tgz > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: staging/
          if-no-files-found: error

  npm:
    needs: [guard, pack]
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The OIDC token npm exchanges for the publish, and signs the provenance with.
      id-token: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # registry-url as npm's trusted publishing guide has it. No cache, as everywhere here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # Older npm has no trusted publishing and would fail with an authentication error.
      - name: npm supports trusted publishing
        run: |
          set -euo pipefail
          have="$(npm --version)"
          echo "npm $have"
          if [ "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $have predates trusted publishing (11.5.1)."
            exit 1
          fi

      # Asked of the registry without credentials: 404 means not published, 200 means it is,
      # anything else is an answer this job cannot read.
      - name: The version is not on npm yet
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/district-social/$VERSION")"
          case "$status" in
            404) echo "district-social@$VERSION is not on npm yet" ;;
            200) echo "::error::district-social@$VERSION is already on npm. Refusing to publish it again."; exit 1 ;;
            *) echo "::error::the npm registry answered $status for district-social@$VERSION"; exit 1 ;;
          esac

      - name: Publish to npm
        working-directory: package
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          tarball="district-social-${VERSION}.tgz"
          test -f "$tarball"
          npm publish "./$tarball" --provenance --access public

  # The release assets Scorecard's Signed-Releases check and a downstream verifier look for:
  #   district-social-X.Y.Z.tgz                 the tarball npm published, byte for byte
  #   SHA256SUMS                                its SHA-256, from the pack job
  #   district-social-X.Y.Z.sigstore.json       the SLSA provenance npm published for it, a
  #                                             Sigstore bundle
  #   district-social-X.Y.Z.intoto.jsonl        every attestation npm holds for the version
  #                                             (provenance and publish), one Sigstore bundle
  #                                             per line, the format `gh attestation` writes
  # The attestations are read back from the public npm registry after the publish, and
  # refused unless their subject is this tarball's SHA-512.
  release:
    needs: [guard, pack, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release and upload its assets
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      # For CHANGELOG.md, the release notes when this job creates the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # The registry can take a moment to serve a new version's attestations, so this asks
      # a bounded number of times (at most 20 tries, 15 seconds apart).
      - name: Fetch and check the provenance npm recorded
        working-directory: package
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          tarball="district-social-${VERSION}.tgz"
          test -f "$tarball"
          url="https://registry.npmjs.org/-/npm/v1/attestations/district-social@${VERSION}"
          for attempt in $(seq 1 20); do
            status="$(curl -sS -o attestations.json -w '%{http_code}' "$url")"
            if [ "$status" = 200 ]; then break; fi
            echo "attempt $attempt: the registry answered $status for the attestations"
            if [ "$attempt" = 20 ]; then
              echo "::error::no attestations for district-social@$VERSION after 20 tries."
              exit 1
            fi
            sleep 15
          done
          jq -c '.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1") | .bundle' \
            attestations.json > provenance.jsonl
          if [ "$(wc -l < provenance.jsonl)" != 1 ]; then
            echo "::error::expected exactly one SLSA provenance attestation for district-social@$VERSION."
            exit 1
          fi
          # The provenance must be about this tarball and nothing else.
          want="$(sha512sum "$tarball" | cut -d ' ' -f 1)"
          have="$(jq -r '.dsseEnvelope.payload' provenance.jsonl | base64 -d | jq -r '.subject[].digest.sha512')"
          if [ "$have" != "$want" ]; then
            echo "::error::the provenance's subject ($have) is not this tarball ($want)."
            exit 1
          fi
          echo "the provenance's subject is $tarball (sha512 $want)"
          jq '.' provenance.jsonl > "district-social-${VERSION}.sigstore.json"
          jq -c '.attestations[].bundle' attestations.json > "district-social-${VERSION}.intoto.jsonl"
          rm attestations.json provenance.jsonl
          ls -l

      # An asset already on the release (attached by hand, or by an earlier attempt) is
      # left alone when its digest matches the local file, and fails the job when it does
      # not; nothing here replaces an asset.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            "package/district-social-${VERSION}.tgz"
            package/SHA256SUMS
            "package/district-social-${VERSION}.sigstore.json"
            "package/district-social-${VERSION}.intoto.jsonl"
          )
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json 2> release.err; then
            upload=()
            for f in "${files[@]}"; do
              name="$(basename "$f")"
              digest="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest // "unknown"' release.json)"
              if [ -z "$digest" ]; then
                upload+=("$f")
              elif [ "$digest" = "sha256:$(sha256sum "$f" | cut -d ' ' -f 1)" ]; then
                echo "$name is already on the release with the same digest"
              else
                echo "::error::$name is already on the $TAG release with digest $digest, which is not this file."
                exit 1
              fi
            done
            if [ "${#upload[@]}" -gt 0 ]; then
              gh release upload "$TAG" "${upload[@]}" -R "$GITHUB_REPOSITORY"
            fi
          elif grep -q 'HTTP 404' release.err; then
            # The version's CHANGELOG.md section, without its heading, as the notes.
            awk -v head="## [${VERSION}]" '
              index($0, head) == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md > notes.md
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "::error::CHANGELOG.md has no section for $VERSION."
              exit 1
            fi
            gh release create "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" \
              --verify-tag --title "district-social ${VERSION}" --notes-file notes.md
          else
            cat release.err
            exit 1
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name + " " + .digest'
