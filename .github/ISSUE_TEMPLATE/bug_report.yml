name: Bug report
description: Something in the engine or the CLI does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        A security problem goes through private vulnerability reporting instead (see
        SECURITY.md). Never paste an access token, API key or password here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The district-social version from npm, or the commit if you run from a clone.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: v24.11.0
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Network
      description: The social network involved, if any.
      placeholder: bluesky
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest code or command that shows it. Replace any credential with a placeholder.
      render: ts
